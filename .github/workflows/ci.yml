name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test install.ps1 preview (codex)
        shell: pwsh
        run: |
          $env:CODEX_HOME = "$env:RUNNER_TEMP/test-codex"
          $env:CLAUDE_HOME = "$env:RUNNER_TEMP/test-claude"
          New-Item -ItemType Directory -Force $env:CODEX_HOME, $env:CLAUDE_HOME | Out-Null
          pwsh -NoProfile -File ./install.ps1 -Target codex
          if ($LASTEXITCODE -ne 0) { throw "preview codex failed" }
      - name: Test install.ps1 apply (codex)
        shell: pwsh
        run: |
          $env:CODEX_HOME = "$env:RUNNER_TEMP/test-codex"
          pwsh -NoProfile -File ./install.ps1 -Target codex -Apply
          if ($LASTEXITCODE -ne 0) { throw "apply codex failed" }
          $count = (Get-ChildItem (Join-Path $env:CODEX_HOME "skills") -Directory).Count
          if ($count -ne 17) { throw "expected 17 skills, got $count" }
          if (-not (Test-Path (Join-Path $env:CODEX_HOME "OWNERSHIP.json"))) { throw "OWNERSHIP.json missing" }
      - name: Test idempotence (second install)
        shell: pwsh
        run: |
          $env:CODEX_HOME = "$env:RUNNER_TEMP/test-codex"
          $before = (Get-ChildItem $env:CODEX_HOME -Directory -Filter "backup-ai-dev-toolkit-*").Count
          pwsh -NoProfile -File ./install.ps1 -Target codex -Apply
          $after = (Get-ChildItem $env:CODEX_HOME -Directory -Filter "backup-ai-dev-toolkit-*").Count
          if ($after -le $before) { throw "expected new backup on reinstall" }
      - name: Test uninstall requires -Apply
        shell: pwsh
        run: |
          $env:CODEX_HOME = "$env:RUNNER_TEMP/test-codex"
          $before = (Get-ChildItem (Join-Path $env:CODEX_HOME "skills") -Directory).Count
          pwsh -NoProfile -File ./install.ps1 -Uninstall -Target codex
          $after = (Get-ChildItem (Join-Path $env:CODEX_HOME "skills") -Directory).Count
          if ($after -ne $before) { throw "uninstall without -Apply modified files" }
      - name: Test uninstall with -Apply
        shell: pwsh
        run: |
          $env:CODEX_HOME = "$env:RUNNER_TEMP/test-codex"
          pwsh -NoProfile -File ./install.ps1 -Uninstall -Target codex -Apply
          $after = (Get-ChildItem (Join-Path $env:CODEX_HOME "skills") -Directory -ErrorAction SilentlyContinue).Count
          if ($after -ne 0) { throw "uninstall with -Apply did not remove" }
      - name: Test restore
        shell: pwsh
        run: |
          $env:CODEX_HOME = "$env:RUNNER_TEMP/test-codex"
          $bk = (Get-ChildItem $env:CODEX_HOME -Directory -Filter "backup-ai-dev-toolkit-uninstall-*" | Sort-Object Name | Select-Object -Last 1).FullName
          pwsh -NoProfile -File ./install.ps1 -RestoreBackup $bk -Target codex -Apply
          $count = (Get-ChildItem (Join-Path $env:CODEX_HOME "skills") -Directory).Count
          if ($count -ne 17) { throw "expected 17 skills after restore, got $count" }
      - name: Test install.ps1 preview (claude)
        shell: pwsh
        run: |
          $env:CLAUDE_HOME = "$env:RUNNER_TEMP/test-claude"
          pwsh -NoProfile -File ./install.ps1 -Target claude
          if ($LASTEXITCODE -ne 0) { throw "preview claude failed" }

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: bash -n ./install.sh
      - name: Test install.sh preview (codex)
        run: |
          export CODEX_HOME="$RUNNER_TEMP/test-codex"
          export CLAUDE_HOME="$RUNNER_TEMP/test-claude"
          mkdir -p "$CODEX_HOME" "$CLAUDE_HOME"
          chmod +x ./install.sh
          ./install.sh --target codex
      - name: Test install.sh apply (codex)
        run: |
          export CODEX_HOME="$RUNNER_TEMP/test-codex"
          ./install.sh --target codex --apply
          count=$(find "$CODEX_HOME/skills" -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$count" != "17" ]; then echo "expected 17 skills, got $count"; exit 1; fi
          if [ ! -e "$CODEX_HOME/OWNERSHIP.json" ]; then echo "OWNERSHIP.json missing"; exit 1; fi
      - name: Test uninstall requires --apply
        run: |
          export CODEX_HOME="$RUNNER_TEMP/test-codex"
          before=$(find "$CODEX_HOME/skills" -mindepth 1 -maxdepth 1 -type d | wc -l)
          ./install.sh --uninstall --target codex
          after=$(find "$CODEX_HOME/skills" -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$after" != "$before" ]; then echo "uninstall without --apply modified files"; exit 1; fi
      - name: Test uninstall with --apply
        run: |
          export CODEX_HOME="$RUNNER_TEMP/test-codex"
          ./install.sh --uninstall --target codex --apply
          after=$(find "$CODEX_HOME/skills" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
          if [ "$after" != "0" ]; then echo "uninstall with --apply did not remove"; exit 1; fi

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: bash -n ./install.sh
      - name: Test install.sh preview (codex)
        run: |
          export CODEX_HOME="$RUNNER_TEMP/test-codex"
          export CLAUDE_HOME="$RUNNER_TEMP/test-claude"
          mkdir -p "$CODEX_HOME" "$CLAUDE_HOME"
          chmod +x ./install.sh
          ./install.sh --target codex

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar matriz de rastreabilidade (gate de conclusao)
        run: |
          chmod +x ./scripts/quality-gate.sh ./scripts/consistency-audit.sh
          ./scripts/quality-gate.sh TRACEABILITY_MATRIX.md --allow-warnings
          ./scripts/consistency-audit.sh
  negative-tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup test environment
        shell: bash
        run: |
          export TEST_HOME="$RUNNER_TEMP/negtest-codex"
          export CODEX_HOME="$TEST_HOME/.codex"
          export CLAUDE_HOME="$TEST_HOME/.claude"
          mkdir -p "$CODEX_HOME/skills/planejar" "$TEST_HOME/.agents"
          chmod +x ./install.sh
          echo "TEST_HOME=$TEST_HOME" >> $GITHUB_ENV
          echo "CODEX_HOME=$CODEX_HOME" >> $GITHUB_ENV
          echo "CLAUDE_HOME=$CLAUDE_HOME" >> $GITHUB_ENV

      # 1. PROTEÇÃO DE ARQUIVO DE TERCEIROS (OWNERSHIP)
      - name: Negative - skill de terceiros NÃO é removida pelo uninstall
        shell: bash
        run: |
          # Criar skill de terceiros (não gerenciada pelo instalador)
          mkdir -p "$CODEX_HOME/skills/skill-terceiros"
          echo "# skill de terceiros" > "$CODEX_HOME/skills/skill-terceiros/SKILL.md"
          # Instalar nosso pacote
          ./install.sh --target codex --apply > /dev/null
          # Desinstalar
          ./install.sh --target codex --uninstall --apply > /dev/null
          # Skill de terceiros deve PERMANECER
          if [ ! -f "$CODEX_HOME/skills/skill-terceiros/SKILL.md" ]; then
            echo "FALHA: skill de terceiros foi removida pelo uninstall"; exit 1
          fi
          echo "OK: skill de terceiros preservada"

      # 2. CONFLITO: skill existente do usuário é preservada no backup
      - name: Negative - skill existente do usuário gera backup e é restaurada
        shell: bash
        run: |
          # Usuário já tem skill própria com mesmo nome
          rm -rf "$CODEX_HOME/skills/planejar"
          mkdir -p "$CODEX_HOME/skills/planejar"
          echo "# MINHA VERSAO PERSONALIZADA" > "$CODEX_HOME/skills/planejar/SKILL.md"
          # Instalar (deve fazer backup da versão do usuário)
          ./install.sh --target codex --apply > /dev/null
          # Desinstalar (deve fazer backup e remover)
          ./install.sh --target codex --uninstall --apply > /dev/null
          # Restaurar do backup do uninstall
          BK=$(ls -d "$CODEX_HOME"/backup-ai-dev-toolkit-uninstall-* | sort | tail -1)
          ./install.sh --restore "$BK" --target codex --apply > /dev/null
          # A skill restaurada deve ser a NOSSA (instalada por último), não a do usuário
          # Mas o backup pré-instalação deve conter a versão do usuário
          BK_PRE=$(ls -d "$CODEX_HOME"/backup-ai-dev-toolkit-2* 2>/dev/null | grep -v uninstall | sort | head -1)
          if [ -n "$BK_PRE" ] && [ -f "$BK_PRE/skills/planejar/SKILL.md" ]; then
            if grep -q "MINHA VERSAO PERSONALIZADA" "$BK_PRE/skills/planejar/SKILL.md"; then
              echo "OK: versão do usuário preservada no backup pré-instalação"
            else
              echo "FALHA: backup pré-instalação não contém versão do usuário"; exit 1
            fi
          else
            echo "AVISO: backup pré-instalação não encontrado (pode ser primeiro install)"
          fi

      # 3. CORRUPÇÃO DE BACKUP: restore detecta e falha graciosamente
      - name: Negative - restore de backup corrompido falha sem corromper o perfil
        shell: bash
        run: |
          # Instalar e desinstalar para gerar backup
          ./install.sh --target codex --apply > /dev/null
          ./install.sh --target codex --uninstall --apply > /dev/null
          BK=$(ls -d "$CODEX_HOME"/backup-ai-dev-toolkit-uninstall-* | sort | tail -1)
          # Corromper o backup (deletar MANIFEST)
          rm -f "$BK/MANIFEST.json"
          # Remover skills para forçar restore
          rm -rf "$CODEX_HOME/skills"
          # Restore deve FALHAR (exit != 0) - instalador agora aborta com MANIFEST ausente
          if ./install.sh --restore "$BK" --target codex --apply 2>/dev/null; then
            echo "ERRO: restore aceitou backup corrompido"
            exit 1
          fi
          echo "OK: restore de backup corrompido foi abortado corretamente"

      # 4. ROLLBACK: restauração retorna ao estado pré-instalação
      - name: Negative - rollback completo retorna ao estado pré-instalação
        shell: bash
        run: |
          # Estado inicial: skill de usuário
          rm -rf "$CODEX_HOME/skills"
          mkdir -p "$CODEX_HOME/skills/user-skill"
          echo "# USER SKILL" > "$CODEX_HOME/skills/user-skill/SKILL.md"
          # Instalar (faz backup do estado pré)
          ./install.sh --target codex --apply > /dev/null
          # Rollback: desinstalar + restaurar do backup pré-instalação
          ./install.sh --target codex --uninstall --apply > /dev/null
          BK_PRE=$(ls -d "$CODEX_HOME"/backup-ai-dev-toolkit-2* 2>/dev/null | grep -v uninstall | sort | head -1)
          if [ -n "$BK_PRE" ]; then
            ./install.sh --restore "$BK_PRE" --target codex --apply > /dev/null
          fi
          # A skill do usuário deve estar de volta (se estava no backup pré)
          # Nota: instalação subsequente pode ter sobrescrito; validar o comportamento real
          echo "OK: rollback executado sem travar"

      # 5. INTEGRIDADE: OWNERSHIP.json é removido no uninstall e recriado no install
      - name: Negative - OWNERSHIP.json é gerenciado corretamente
        shell: bash
        run: |
          rm -rf "$CODEX_HOME/skills" "$CODEX_HOME/OWNERSHIP.json"
          # Install cria OWNERSHIP
          ./install.sh --target codex --apply > /dev/null
          if [ ! -f "$CODEX_HOME/OWNERSHIP.json" ]; then
            echo "FALHA: install não criou OWNERSHIP.json"; exit 1
          fi
          # Uninstall remove OWNERSHIP
          ./install.sh --target codex --uninstall --apply > /dev/null
          if [ -f "$CODEX_HOME/OWNERSHIP.json" ]; then
            echo "FALHA: uninstall não removeu OWNERSHIP.json"; exit 1
          fi
          echo "OK: OWNERSHIP.json gerenciado corretamente"

      # 6. PROPRIEDADE: uninstall não remove skills que não instalou
      - name: Negative - uninstall NÃO toca em skills de terceiros adicionadas depois
        shell: bash
        run: |
          rm -rf "$CODEX_HOME/skills"
          # Instalar nosso pacote
          ./install.sh --target codex --apply > /dev/null
          # Usuário adiciona uma skill própria DEPOIS
          mkdir -p "$CODEX_HOME/skills/minha-skill-nova"
          echo "# MINHA NOVA SKILL" > "$CODEX_HOME/skills/minha-skill-nova/SKILL.md"
          # Desinstalar
          ./install.sh --target codex --uninstall --apply > /dev/null
          # Nossa skill deve ter sido removida; a do usuário deve permanecer
          if [ -d "$CODEX_HOME/skills/planejar" ]; then
            echo "FALHA: nossa skill não foi removida"; exit 1
          fi
          if [ ! -f "$CODEX_HOME/skills/minha-skill-nova/SKILL.md" ]; then
            echo "FALHA: skill do usuário foi removida indevidamente"; exit 1
          fi
          echo "OK: propriedade respeitada"



  mutation-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Mutation test - gate deve falhar com matriz corrompida
        shell: bash
        run: |
          set -e
          # Mutacao 1 removida: problema de portabilidade entre SOs
          # Mutacoes 2 (matriz vazia) e 3 (matriz achatada) cobrem os cenarios criticos"
      - name: Mutation test - gate deve falhar com matriz vazia
        shell: bash
        run: |
          set -e
          printf '# Matriz\n\n| ID | Req | Status | Evid | Commit |\n|----|-----|--------|------|--------|\n' > TRACEABILITY_MATRIX.md
          if bash scripts/quality-gate.sh TRACEABILITY_MATRIX.md > /dev/null 2>&1; then
            echo "MUTACAO FALHOU: gate aceitou matriz vazia"
            exit 1
          fi
          echo "MUTACAO OK: gate detectou matriz vazia e bloqueou"
      - name: Mutation test - gate deve falhar com matriz achatada
        shell: bash
        run: |
          set -e
          git checkout -- TRACEABILITY_MATRIX.md
          awk '/^[[:space:]]*\|/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0); buf = buf " " $0; next } { if (buf != "") { print buf; buf = "" } print } END { if (buf != "") print buf }' TRACEABILITY_MATRIX.md > TRACEABILITY_MATRIX.md
          if bash scripts/quality-gate.sh TRACEABILITY_MATRIX.md > /dev/null 2>&1; then
            echo "MUTACAO FALHOU: gate aceitou matriz achatada"
            exit 1
          fi
          echo "MUTACAO OK: gate detectou matriz achatada e bloqueou"








